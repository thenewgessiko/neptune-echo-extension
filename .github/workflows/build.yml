name: Neptune Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Resolve version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -Fx "val verName = \"$VERSION\"" app/build.gradle.kts
          grep -Fx "val verName = \"$VERSION\"" ext/build.gradle.kts
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Neptune
        run: |
          chmod +x gradlew
          ./gradlew :ext:shadowJar :app:assembleDebug

      - name: Prepare release files
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/neptune-$VERSION.eapk
          cp ext/build/libs/*-all.jar artifacts/neptune-$VERSION.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Neptune ${{ env.VERSION }}
          make_latest: true
          prerelease: false
          body: |
            First stable release of Neptune.
            Based on DEV.7.
          files: artifacts/*
          fail_on_unmatched_files: true
