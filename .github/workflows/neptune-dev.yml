name: Neptune DEV
on:
  push:
    branches: [dev]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - run: chmod +x gradlew && ./gradlew :ext:shadowJar :app:assembleDebug
      - run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/neptune-0.1.0-DEV.3.eapk
          cp ext/build/libs/*-all.jar artifacts/neptune-0.1.0-DEV.3.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Neptune-0.1.0-DEV.3
          path: artifacts/
